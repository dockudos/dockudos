name: Docs

# Builds the documentation as a static site. Pull requests only check that it builds;
# pushes to the default branch also publish it to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
on:
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  push:
    branches: [main, master]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "Last updated" dates come from Git history

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generated pages (API reference) and the CLI itself come from workspace builds.
      - run: pnpm nx run-many -t build -p @dockudos/cli @dockudos/next @dockudos/ui @dockudos/core
      - run: pnpm nx run @dockudos/docs:generate

      # Project sites are served from https://<owner>.github.io/<repo>/, so the base path is the repo name.
      - name: Build static site
        working-directory: apps/docs
        run: pnpm exec dockudos build --static --base-path "/${GITHUB_REPOSITORY#*/}"

      - run: touch apps/docs/out/.nojekyll

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: apps/docs/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
