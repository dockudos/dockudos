name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request' && matrix.node == '22'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

      - name: Formatting
        if: matrix.node == '22'
        run: pnpm format:check

      - name: Module boundaries are enforced
        if: matrix.node == '22'
        run: pnpm check:boundaries

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint, typecheck, test, build, e2e (affected)
        run: pnpm nx affected -t lint typecheck test build e2e

      # The assistant is measured on every change (apps/example/specs/eval.spec.ts). The numbers go in the run
      # summary, so one commit can be compared with the next.
      - name: Evaluation summary
        if: always() && matrix.node == '22'
        run: |
          if [ -f apps/example/eval/results/latest.json ]; then
            node -e "
              const r = JSON.parse(require('fs').readFileSync('apps/example/eval/results/latest.json', 'utf8'));
              const names = [...new Set(Object.values(r).flatMap((m) => Object.keys(m.metrics)))];
              const modes = Object.keys(r);
              const head = '| Metric | ' + modes.join(' | ') + ' |\n| --- |' + modes.map(() => ' --- |').join('');
              const rows = names.map((n) => '| ' + n + ' | ' + modes.map((m) => (r[m].metrics[n] ?? NaN).toFixed(3)).join(' | ') + ' |').join('\n');
              console.log('### Assistant evaluation (stand-in model)\n\n' + head + '\n' + rows);
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evaluation results
        if: always() && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: apps/example/eval/results
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node${{ matrix.node }}
          path: apps/example/playwright-report
          if-no-files-found: ignore

  # Publishes the built packages to a local registry and proves a stranger could use them:
  # `npx @dockudos/cli init`, install, build. This is the "published packages install" check.
  packages:
    name: Packages install and build a new site
    runs-on: ubuntu-latest
    needs: main
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx run-many -t build

      - name: Start the local registry
        run: |
          pnpm nx local-registry &
          for i in $(seq 1 30); do curl -sf http://localhost:4873/-/ping && exit 0; sleep 1; done
          echo "registry did not start" && exit 1

      - name: Publish to the local registry
        run: |
          npm config set //localhost:4873/:_authToken local-registry-token
          pnpm nx release publish --registry http://localhost:4873/

      - run: pnpm verify:packages

      - run: pnpm verify:init
