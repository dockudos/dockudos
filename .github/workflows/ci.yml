name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request' && matrix.node == '22'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

      - name: Formatting
        if: matrix.node == '22'
        run: pnpm format:check

      - name: Module boundaries are enforced
        if: matrix.node == '22'
        run: pnpm check:boundaries

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint, typecheck, test, build, e2e (affected)
        run: pnpm nx affected -t lint typecheck test build e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node${{ matrix.node }}
          path: apps/example/playwright-report
          if-no-files-found: ignore
