name: Release

# Manual. Defaults to a dry run; untick `dry_run` to publish to npm with provenance.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (no tags, commits or publishing)
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: pnpm nx release ${{ inputs.dry_run && '--dry-run' || '' }} --yes
