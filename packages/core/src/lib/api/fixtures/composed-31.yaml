openapi: 3.1.0
info:
  title: Composed
  version: 2.0.0
  description: "Uses {braces}, <tags> and\n\nimport x from 'y'\n\n<!-- a comment -->"
servers:
  - url: https://{region}.example.com/v2
    variables:
      region:
        default: eu
        enum: [eu, us]
security:
  - key: []
paths:
  /nodes/{id}:
    parameters:
      - name: id
        in: path
        schema: { type: string, format: uuid }
    get:
      operationId: getNode
      summary: Get a node
      tags: [Nodes]
      parameters:
        - $ref: '#/components/parameters/Expand'
      responses:
        '200':
          description: The node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putNode
      tags: [Nodes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Leaf'
                - $ref: '#/components/schemas/Branch'
              discriminator:
                propertyName: kind
      responses:
        '204': { description: Updated }
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200': { description: ok }
webhooks:
  nodeChanged:
    post:
      operationId: nodeChanged
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Node' }
      responses:
        '200': { description: ok }
components:
  securitySchemes:
    key: { type: apiKey, in: header, name: X-Key }
  parameters:
    Expand:
      name: expand
      in: query
      schema: { type: array, items: { type: string } }
  responses:
    Problem:
      description: Problem
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title: { type: string }
  schemas:
    Node:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        parent: { $ref: '#/components/schemas/Node' }
        children:
          type: array
          items: { $ref: '#/components/schemas/Node' }
        note: { type: [string, 'null'], minLength: 1 }
        rank: { type: integer, exclusiveMinimum: 0, maximum: 10 }
    Base:
      type: object
      properties:
        kind: { type: string }
    Leaf:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          required: [value]
          properties:
            value: { type: number }
    Branch:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          properties:
            nodes:
              type: array
              items: { $ref: '#/components/schemas/Node' }
