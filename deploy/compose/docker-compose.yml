# The whole dockudos platform on one machine.
#
#   cp .env.example .env        # then edit the three secrets and your URLs
#   docker compose up -d
#   docker compose exec api node dist/server.js bootstrap "My team"     # prints an admin API key
#
# One image runs every platform role; DOCKUDOS_SERVICES picks which. The job queue is Postgres, so there is no separate
# queue service. Build images locally with `docker compose build`, or point DOCKUDOS_IMAGE / DOCKUDOS_EDITOR_IMAGE at a registry.

name: dockudos

x-platform: &platform
  image: ${DOCKUDOS_IMAGE:-dockudos/platform:local}
  build:
    context: ../..
    dockerfile: deploy/docker/platform.Dockerfile
  restart: unless-stopped
  env_file: .env
  environment: &platform-env
    DOCKUDOS_DATABASE_URL: postgres://${POSTGRES_USER:-dockudos}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-dockudos}
    DOCKUDOS_SESSION_SECRET: ${DOCKUDOS_SESSION_SECRET:?Set DOCKUDOS_SESSION_SECRET in .env (openssl rand -hex 32)}
    DOCKUDOS_PUBLIC_URL: ${DOCKUDOS_PUBLIC_URL:-http://localhost:8080}
    DOCKUDOS_SITES_DOMAIN: ${DOCKUDOS_SITES_DOMAIN:-sites.localhost}
    DOCKUDOS_S3_ENDPOINT: http://storage:9000
    DOCKUDOS_S3_BUCKET: ${DOCKUDOS_S3_BUCKET:-dockudos}
    DOCKUDOS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-dockudos}
    DOCKUDOS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    DOCKUDOS_TRUST_PROXY: "true"
  networks: [internal]

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dockudos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dockudos}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dockudos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes: [objects:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  storage-init:
    image: minio/mc:latest
    depends_on:
      storage: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dockudos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      BUCKET: ${DOCKUDOS_S3_BUCKET:-dockudos}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://storage:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" && mc mb --ignore-existing \"local/$$BUCKET\""]
    restart: "no"
    networks: [internal]

  # Applies database migrations once, then exits. Every other service waits for it.
  migrate:
    <<: *platform
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *platform-env
      DOCKUDOS_SERVICES: worker
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck: { disable: true }

  # API, webhook receiver, analytics ingestion and dashboards' data, sign-in. Split with DOCKUDOS_SERVICES if you need to scale one.
  api:
    <<: *platform
    environment:
      <<: *platform-env
      DOCKUDOS_SERVICES: web,hooks,analytics,auth,editor
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }

  # Builds sites from Git pushes. It runs code from your repositories (with install scripts off); see notes/security.
  worker:
    <<: *platform
    environment:
      <<: *platform-env
      DOCKUDOS_SERVICES: worker
    volumes: [work:/var/lib/dockudos]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }

  # Watches code repositories and opens documentation pull requests. Needs DOCKUDOS_LLM_* to draft edits.
  agent:
    <<: *platform
    environment:
      <<: *platform-env
      DOCKUDOS_SERVICES: agent
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }

  # Serves the built sites at <slug>.${DOCKUDOS_SITES_DOMAIN}. A different host from the dashboard on purpose.
  site:
    <<: *platform
    environment:
      <<: *platform-env
      DOCKUDOS_SERVICES: site
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }

  # The dashboard and editor.
  editor:
    image: ${DOCKUDOS_EDITOR_IMAGE:-dockudos/editor:local}
    build:
      context: ../..
      dockerfile: deploy/docker/editor.Dockerfile
    restart: unless-stopped
    environment:
      DOCKUDOS_API_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]

  # One front door: the dashboard, the webhook URL for your Git host, and the hosted sites.
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${DOCKUDOS_HTTP_PORT:-8080}:80"
    environment:
      DOCKUDOS_PLATFORM_ADDRESS: ${DOCKUDOS_PLATFORM_ADDRESS:-http://localhost}
      DOCKUDOS_SITES_ADDRESS: ${DOCKUDOS_SITES_ADDRESS:-http://*.sites.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      editor: { condition: service_started }
      site: { condition: service_healthy }
    networks: [internal]

networks:
  internal: {}

volumes:
  pgdata: {}
  objects: {}
  work: {}
  caddy_data: {}
