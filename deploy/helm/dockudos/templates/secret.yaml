{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dockudos.secretName" . }}
  labels: {{- include "dockudos.labels" . | nindent 4 }}
type: Opaque
stringData:
  DOCKUDOS_SESSION_SECRET: {{ required "secrets.sessionSecret (32+ characters) or secrets.existingSecret is required" .Values.secrets.sessionSecret | quote }}
  DOCKUDOS_DATABASE_URL: {{ required "secrets.databaseUrl is required when postgresql.enabled is false" (include "dockudos.databaseUrl" .) | quote }}
  {{- if .Values.minio.enabled }}
  DOCKUDOS_S3_ACCESS_KEY: {{ .Values.minio.auth.username | quote }}
  DOCKUDOS_S3_SECRET_KEY: {{ required "minio.auth.password is required when minio.enabled" .Values.minio.auth.password | quote }}
  {{- else }}
  {{- with .Values.secrets.s3AccessKey }}
  DOCKUDOS_S3_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.s3SecretKey }}
  DOCKUDOS_S3_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- range $key, $name := dict "githubToken" "DOCKUDOS_GITHUB_TOKEN" "gitlabToken" "DOCKUDOS_GITLAB_TOKEN" "oidcClientSecret" "DOCKUDOS_OIDC_CLIENT_SECRET" "llmApiKey" "DOCKUDOS_LLM_API_KEY" "docsAuthSecret" "DOCKUDOS_DOCS_AUTH_SECRET" "metricsToken" "DOCKUDOS_METRICS_TOKEN" }}
  {{- with index $.Values.secrets $key }}
  {{ $name }}: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
